<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chashma Bazar — Invoice Verification</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #EEF2F6;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(15, 31, 61, 0.12);
      border: 1px solid #CBD5E1;
    }
    .header {
      background: #0F1F3D;
      color: #FFFFFF;
      text-align: center;
      padding: 24px 18px 20px;
      border-bottom: 3px solid #1F7A55;
    }
    .verified-badge {
      display: inline-block;
      background: #1F7A55;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .tagline {
      font-size: 12px;
      font-style: italic;
      color: #E2C08D;
      margin-top: 4px;
    }
    .body {
      padding: 18px 22px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #E2E8F0;
      font-size: 13.5px;
      gap: 12px;
    }
    .row:last-child { border-bottom: none; }
    .label { color: #334155; font-weight: 500; }
    .value { color: #0F172A; font-weight: 700; text-align: right; }
    .status-badge {
      display: inline-block;
      padding: 3px 11px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .st-delivered { background: #D1E7DD; color: #0F5132; border: 1px solid #0F5132; }
    .st-ready     { background: #E0F2FE; color: #0C4A6E; border: 1px solid #0C4A6E; }
    .st-processing{ background: #FEF3C7; color: #78350F; border: 1px solid #78350F; }
    .paid-text { color: #0F5132; font-weight: 800; }
    .due-text  { color: #991B1B; font-weight: 800; }
    .footer {
      background: #F8FAFC;
      border-top: 1px solid #E2E8F0;
      text-align: center;
      padding: 14px 18px;
      font-size: 12px;
      color: #1E293B;
      line-height: 1.5;
    }
    .dev-credit {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #CBD5E1;
      font-size: 10.5px;
      color: #475569;
      letter-spacing: 0.3px;
    }
    .loading, .error {
      text-align: center;
      padding: 36px 20px;
      font-size: 14px;
      font-weight: 600;
    }
    .error { color: #B91C1C; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="verified-badge" id="topBadge">✓ VERIFIED INVOICE</div>
      <div class="brand">CHASHMA BAZAR</div>
      <div class="tagline">Trusted Companion of Your Eyes</div>
    </div>

    <div class="body" id="content">
      <div class="loading">Verifying invoice authenticity...</div>
    </div>

    <div class="footer">
      <div><strong>Sawkat Bhabon, 94 New Elephant Road, Dhaka</strong></div>
      <div>Tel: 01644-138132</div>
      <div class="dev-credit">System Engineered by Md. Tanbir Hasan</div>
    </div>
  </div>

  <script>
    // এখানে আপনার বর্তমান Orders Web App URL-টি বসান
    const API_URL = "https://script.google.com/macros/s/AKfycbwGOTnA9J-ycXHUYkzxXpmy2QQeoBndPb6rkEEjsnGaqBT1fChPk2CpdmtSvWVhLTqo/exec";

    const params = new URLSearchParams(window.location.search);
    const inv = params.get("inv");
    const contentEl = document.getElementById("content");
    const badgeEl = document.getElementById("topBadge");

    if (!inv) {
      badgeEl.textContent = "INVOICE PORTAL";
      contentEl.innerHTML = '<div class="error">No invoice number provided. Please scan a valid QR code.</div>';
    } else {
      fetch(`${API_URL}?inv=${encodeURIComponent(inv)}&mode=json`)
        .then(r => r.json())
        .then(res => {
          if (!res.success || !res.data) {
            badgeEl.textContent = "✕ INVALID INVOICE";
            badgeEl.style.background = "#B91C1C";
            contentEl.innerHTML = `<div class="error">${res.message || "Invoice not found in Chashma Bazar records."}</div>`;
            return;
          }
          const d = res.data;
          const st = (d.status || "PROCESSING").toUpperCase();
          const stClass = st === "DELIVERED" ? "st-delivered" : (st === "READY" ? "st-ready" : "st-processing");
          const dueHtml = d.isPaid
            ? `<span class="paid-text">FULL PAID (Tk. 0)</span>`
            : `<span class="due-text">Tk. ${d.due}</span>`;

          contentEl.innerHTML = `
            <div class="row"><span class="label">Invoice No</span><span class="value">${d.invoiceNo}</span></div>
            <div class="row"><span class="label">Order Date & Time</span><span class="value">${d.orderDateTime}</span></div>
            <div class="row"><span class="label">Delivery Time</span><span class="value">${d.deliveryTime}</span></div>
            <div class="row"><span class="label">Customer</span><span class="value">${d.customerName}</span></div>
            <div class="row"><span class="label">Phone</span><span class="value">${d.customerPhone}</span></div>
            <div class="row"><span class="label">Frame / Glass</span><span class="value">${d.frame} / ${d.glass}</span></div>
            <div class="row"><span class="label">Order Status</span><span class="value"><span class="status-badge ${stClass}">${st}</span></span></div>
            <div class="row"><span class="label">Total Bill</span><span class="value">Tk. ${d.total}</span></div>
            <div class="row"><span class="label">Paid Amount</span><span class="value paid-text">Tk. ${d.paid}</span></div>
            <div class="row"><span class="label">Balance Due</span><span class="value">${dueHtml}</span></div>
          `;
        })
        .catch(() => {
          contentEl.innerHTML = '<div class="error">Unable to connect to verification server. Please try again.</div>';
        });
    }
  </script>
</body>
</html>
